schema_version = 3
id = "non-obvious-secret-or-pii-in-code"
title = "Secret or personal data not caught by simple pattern matching"
description = "A real-looking credential, private key, or personal data such as a social security number, full credit card number, or a list of real personal emails/phone numbers appears in source, tests, fixtures, or logs, written in a way that does not use an obvious key/value label such as password or api_key, for example assigned to a generically named variable, embedded in a sample payload, or spread across a multi-line literal. A well-known placeholder or test value, such as the Visa test card number 4111111111111111 or an all-zero or sequential SSN like 000-00-0000 or 123-45-6789, is not a violation even when unlabeled."
mode = "ask"
severity = "high"
evaluation = { kind = "semantic" }

[[examples]]
expected = "violation"
input = { kind = "content", path = "tests/fixtures/sample_user.json", content = "{\"name\": \"Jane Doe\", \"ssn\": \"539-42-1890\", \"card\": \"4539 1488 0343 6467\"}", coverage = "fragment" }
note = "Realistic SSN and full card number in a fixture, with no explicit secret label."

[[examples]]
expected = "violation"
input = { kind = "content", path = "src/legacy/bootstrap.go", content = "var k = \"-----BEGIN RSA PRIVATE KEY-----\\nMIIEpAIBAAKCAQEA...\\n-----END RSA PRIVATE KEY-----\"", coverage = "fragment" }
note = "Embedded private key assigned to a generic variable name."

[[examples]]
expected = "ok"
input = { kind = "content", path = "tests/fixtures/sample_user.json", content = "{\"name\": \"Jane Doe\", \"ssn\": \"000-00-0000\", \"card\": \"4111 1111 1111 1111\"}", coverage = "fragment" }
note = "Well-known placeholder test values, not real personal data."

[[examples]]
expected = "ok"
input = { kind = "content", path = "src/legacy/bootstrap.go", content = "var k = os.Getenv(\"SIGNING_KEY\")", coverage = "fragment" }
note = "Loaded from environment, nothing embedded."
